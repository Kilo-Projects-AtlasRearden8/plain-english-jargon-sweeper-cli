[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plain-english-jargon-sweeper"
version = "0.1.0"
description = "Local-only CLI that scans Markdown and text for jargon, long sentences, and readability issues, suggesting plain-English rewrites."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Asdale Dynamics, LLC"}]
keywords = ["plain-english", "jargon", "readability", "cli", "markdown", "writing"]

[project.scripts]
jargon-sweeper = "jargon_sweeper.cli:main"

[tool.setuptools]
packages = ["jargon_sweeper"]
